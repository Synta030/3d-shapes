<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Know Your 3D Shapes!</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;}

    #app{
      display:flex;flex-direction:row;
      width:100%;height:100vh;
      background:#ffffff;
    }

    /* ── SIDEBAR 20% ── */
    #sidebar{
      width:20%;
      border-right:1px solid #e5e5e3;
      padding:2% 3%;
      display:flex;flex-direction:column;gap:1.5%;
      background:#fafaf8;
      overflow-y:auto;
    }
    #sidebar-title{
      font-size:clamp(10px,1vw,13px);font-weight:600;
      color:#888;text-transform:uppercase;letter-spacing:.08em;
      margin-bottom:4%;
    }
    .shape-btn{
      display:flex;align-items:center;gap:8%;
      padding:5% 6%;
      border-radius:10px;border:2px solid transparent;
      cursor:pointer;background:transparent;
      color:#1a1a1a;
      font-size:clamp(12px,1.1vw,16px);font-weight:400;
      width:100%;text-align:left;overflow:hidden;
      transition:background .12s,border-color .12s;
    }
    .shape-btn:hover{background:#f0f0ee;}
    .shape-btn.active{border-color:#378ADD;color:#185FA5;font-weight:600;background:#fff;}
    .shape-btn .thumb{
      width:clamp(32px,3.5vw,52px);height:clamp(26px,2.8vw,42px);
      border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .shape-btn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;}

    /* ── MAIN 50% ── */
    #main{
      width:50%;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:3% 2%;gap:2%;
    }
    #shape-title{
      font-size:clamp(18px,2.5vw,36px);font-weight:700;
      color:#1a1a1a;text-align:center;
    }
    #canvas-wrap{
      width:min(80%,80vh);
      aspect-ratio:1;
      border-radius:12px;overflow:hidden;cursor:grab;
    }
    #canvas-wrap:active{cursor:grabbing;}
    #rotate-hint{font-size:clamp(11px,1vw,14px);color:#aaa;}

    /* ── PANEL 30% ── */
    #panel{
      width:30%;
      border-left:1px solid #e5e5e3;
      padding:4% 5%;
      display:flex;flex-direction:column;justify-content:center;
      background:#fafaf8;
    }
    #panel-title{
      font-size:clamp(10px,1vw,13px);font-weight:600;
      color:#888;text-transform:uppercase;letter-spacing:.08em;
      margin-bottom:6%;
    }
    .fact-row{
      display:flex;align-items:center;justify-content:space-between;
      padding:5% 0;border-bottom:1px solid #e5e5e3;
    }
    .fact-row:last-of-type{border-bottom:none;}
    .fact-label{font-size:clamp(15px,1.8vw,26px);color:#1a1a1a;font-weight:400;}
    .fact-input{
      width:clamp(48px,5vw,80px);height:clamp(42px,4.5vw,72px);
      text-align:center;
      font-size:clamp(18px,2vw,32px);font-weight:700;
      border:2px solid #ddd;border-radius:10px;
      background:#fff;color:#1a1a1a;outline:none;
      transition:border-color .15s,box-shadow .15s;
    }
    .fact-input:focus{border-color:#378ADD;box-shadow:0 0 0 3px rgba(55,138,221,0.15);}
    .fact-input.correct{border-color:#1D9E75!important;background:#E1F5EE!important;color:#085041!important;box-shadow:none!important;}
    .fact-input.wrong{border-color:#E24B4A!important;background:#FCEBEB!important;color:#501313!important;box-shadow:none!important;}

    #check-btn{
      margin-top:8%;padding:5% 0;
      border-radius:10px;border:2px solid #ddd;
      background:#fff;color:#1a1a1a;
      font-size:clamp(13px,1.4vw,20px);font-weight:700;cursor:pointer;width:100%;
      transition:background .12s;
    }
    #check-btn:hover{background:#f0f0ee;}
    #check-btn:active{opacity:.8;}
    #result-msg{margin-top:4%;font-size:clamp(12px,1.2vw,18px);text-align:center;min-height:1.4em;font-weight:600;}

    /* ── PORTRAIT / MOBILE ── */
    @media (orientation:portrait),(max-width:600px){
      #app{flex-direction:column;height:auto;min-height:100dvh;}

      #sidebar{
        width:100%;height:auto;
        border-right:none;border-bottom:1px solid #e5e5e3;
        flex-direction:row;flex-wrap:nowrap;
        padding:3vw 3vw 2vw;gap:2vw;
        overflow-x:auto;overflow-y:hidden;align-items:center;
      }
      #sidebar-title{display:none;}
      .shape-btn{
        flex-direction:column;align-items:center;
        width:auto;min-width:18vw;flex-shrink:0;
        padding:2vw 2vw;gap:1.5vw;
        font-size:clamp(10px,2.8vw,14px);
        overflow:visible;
      }
      .shape-btn .thumb{width:12vw;height:10vw;max-width:56px;max-height:46px;}
      .shape-btn .lbl{white-space:nowrap;overflow:visible;text-overflow:clip;}

      #main{width:100%;padding:4vw 4vw 3vw;gap:3vw;}
      #shape-title{font-size:clamp(20px,6vw,36px);}
      #canvas-wrap{width:min(86vw,420px);}

      #panel{
        width:100%;border-left:none;border-top:1px solid #e5e5e3;
        padding:5vw 6vw;justify-content:flex-start;
      }
      .fact-label{font-size:clamp(16px,5vw,24px);}
      .fact-input{width:clamp(52px,14vw,80px);height:clamp(46px,13vw,72px);font-size:clamp(20px,6vw,32px);}
      #check-btn{font-size:clamp(14px,4.5vw,20px);padding:4vw 0;margin-top:5vw;}
      #result-msg{font-size:clamp(13px,4vw,18px);}
    }
  </style>
</head>
<body>

<div id="app">
  <div id="sidebar"><div id="sidebar-title">Shapes</div></div>
  <div id="main">
    <div id="shape-title">Rectangular Prism</div>
    <div id="canvas-wrap"></div>
    <div id="rotate-hint">drag to rotate</div>
  </div>
  <div id="panel">
    <div id="panel-title">Properties</div>
    <div class="fact-row">
      <span class="fact-label">Corners</span>
      <input id="inp-corners" class="fact-input" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="?" maxlength="2">
    </div>
    <div class="fact-row">
      <span class="fact-label">Edges</span>
      <input id="inp-edges" class="fact-input" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="?" maxlength="2">
    </div>
    <div class="fact-row">
      <span class="fact-label">Faces</span>
      <input id="inp-faces" class="fact-input" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="?" maxlength="2">
    </div>
    <button id="check-btn">Check answers</button>
    <div id="result-msg"></div>
  </div>
</div>

<!-- Three.js r128 — replace src with "three.min.js" for offline use -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const SHAPES=[
  {id:'cube',     name:'Cube',             corners:8, edges:12,faces:6, color:0x378ADD},
  {id:'rect',     name:'Rectangular Prism',corners:8, edges:12,faces:6, color:0x1D9E75},
  {id:'triprism', name:'Triangular Prism', corners:6, edges:9, faces:5, color:0xBA7517},
  {id:'cylinder', name:'Cylinder',         corners:0, edges:2, faces:3, color:0xD4537E},
  {id:'cone',     name:'Cone',             corners:1, edges:1, faces:2, color:0x7F77DD},
  {id:'sphere',   name:'Sphere',           corners:0, edges:0, faces:1, color:0xD85A30},
];

const THUMB={
  cube:     c=>`<rect x="3" y="9" width="15" height="15" fill="${c}33" stroke="${c}" stroke-width="1.5"/><polygon points="3,9 9,4 24,4 18,9" fill="${c}55" stroke="${c}" stroke-width="1.5"/><polygon points="18,9 24,4 24,19 18,24" fill="${c}44" stroke="${c}" stroke-width="1.5"/>`,
  rect:     c=>`<rect x="1" y="10" width="18" height="11" fill="${c}33" stroke="${c}" stroke-width="1.5"/><polygon points="1,10 6,5 24,5 19,10" fill="${c}55" stroke="${c}" stroke-width="1.5"/><polygon points="19,10 24,5 24,16 19,21" fill="${c}44" stroke="${c}" stroke-width="1.5"/>`,
  triprism: c=>`<polygon points="6,23 26,23 16,5" fill="${c}33" stroke="${c}" stroke-width="1.5"/><polygon points="6,23 11,18 21,18 26,23" fill="${c}44" stroke="${c}" stroke-width="1.5"/>`,
  cylinder: c=>`<ellipse cx="16" cy="8" rx="10" ry="4" fill="${c}55" stroke="${c}" stroke-width="1.5"/><rect x="6" y="8" width="20" height="13" fill="${c}33"/><line x1="6" y1="8" x2="6" y2="21" stroke="${c}" stroke-width="1.5"/><line x1="26" y1="8" x2="26" y2="21" stroke="${c}" stroke-width="1.5"/><ellipse cx="16" cy="21" rx="10" ry="4" fill="${c}33" stroke="${c}" stroke-width="1.5"/>`,
  cone:     c=>`<polygon points="16,3 4,25 28,25" fill="${c}33" stroke="${c}" stroke-width="1.5"/><ellipse cx="16" cy="25" rx="12" ry="3.5" fill="${c}44" stroke="${c}" stroke-width="1.5"/>`,
  sphere:   c=>`<circle cx="16" cy="14" r="11" fill="${c}33" stroke="${c}" stroke-width="1.5"/><ellipse cx="16" cy="14" rx="11" ry="4" fill="none" stroke="${c}" stroke-width="1" stroke-dasharray="3,2"/>`,
};

let currentShape=SHAPES[1],renderer,scene,camera,meshGroup,animId;
let isDragging=false,prevMouse={x:0,y:0},autoRotate=true;

/* ── Build sidebar buttons ── */
SHAPES.forEach(shape=>{
  const hex='#'+shape.color.toString(16).padStart(6,'0');
  const btn=document.createElement('button');
  btn.className='shape-btn';btn.dataset.id=shape.id;
  btn.innerHTML=`<div class="thumb" style="background:${hex}1a;border:1.5px solid ${hex}55;">
    <svg width="100%" height="100%" viewBox="0 0 32 28" xmlns="http://www.w3.org/2000/svg">
      ${(THUMB[shape.id]||THUMB.cube)(hex)}
    </svg>
  </div><span class="lbl">${shape.name}</span>`;
  btn.addEventListener('click',()=>selectShape(shape));
  document.getElementById('sidebar').appendChild(btn);
});

/* ── Init Three.js (once) ── */
const wrap=document.getElementById('canvas-wrap');
renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setClearColor(0x000000,0);
wrap.appendChild(renderer.domElement);
renderer.domElement.style.cssText='width:100%;height:100%;display:block;';
camera=new THREE.PerspectiveCamera(40,1,0.1,100);
camera.position.z=4.8;

function resizeRenderer(){
  const w=wrap.offsetWidth,h=wrap.offsetHeight;
  if(w>0&&h>0){renderer.setSize(w,h);renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));}
}
resizeRenderer();
new ResizeObserver(resizeRenderer).observe(wrap);

/* ── Drag to rotate ── */
const de=renderer.domElement;
de.addEventListener('mousedown',e=>{isDragging=true;autoRotate=false;prevMouse={x:e.clientX,y:e.clientY};de.style.cursor='grabbing';});
window.addEventListener('mousemove',e=>{
  if(!isDragging||!meshGroup)return;
  meshGroup.rotation.y+=(e.clientX-prevMouse.x)*0.012;
  meshGroup.rotation.x+=(e.clientY-prevMouse.y)*0.012;
  prevMouse={x:e.clientX,y:e.clientY};
});
window.addEventListener('mouseup',()=>{if(isDragging){isDragging=false;de.style.cursor='grab';}});
de.addEventListener('touchstart',e=>{e.preventDefault();isDragging=true;autoRotate=false;prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:false});
de.addEventListener('touchmove',e=>{
  e.preventDefault();if(!isDragging||!meshGroup)return;
  meshGroup.rotation.y+=(e.touches[0].clientX-prevMouse.x)*0.012;
  meshGroup.rotation.x+=(e.touches[0].clientY-prevMouse.y)*0.012;
  prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:false});
de.addEventListener('touchend',()=>{isDragging=false;});

/* ── Build 3D scene ── */
function buildScene(shapeId,color){
  if(animId)cancelAnimationFrame(animId);
  scene=new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff,1.0));
  meshGroup=new THREE.Group();
  meshGroup.rotation.x=0.3;meshGroup.rotation.y=-0.4;

  const faceMat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.45,side:THREE.DoubleSide});
  const edgeMat=new THREE.LineBasicMaterial({color,linewidth:2});
  const dotMat=new THREE.MeshBasicMaterial({color});

  let geom;
  if(shapeId==='cube')       geom=new THREE.BoxGeometry(1.6,1.6,1.6);
  else if(shapeId==='rect')  geom=new THREE.BoxGeometry(2.2,1.2,1.0);
  else if(shapeId==='triprism'){
    const sh=new THREE.Shape();
    sh.moveTo(-1.05,-0.75);sh.lineTo(1.05,-0.75);sh.lineTo(0,0.9);sh.closePath();
    geom=new THREE.ExtrudeGeometry(sh,{depth:1.5,bevelEnabled:false});
    geom.translate(0,0,-0.75);
  }
  else if(shapeId==='cylinder') geom=new THREE.CylinderGeometry(0.9,0.9,1.8,32);
  else if(shapeId==='cone')     geom=new THREE.ConeGeometry(1.05,2.1,32);
  else                          geom=new THREE.SphereGeometry(1.1,48,48);

  meshGroup.add(new THREE.Mesh(geom,faceMat));
  meshGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom,15),edgeMat));

  const addDot=(x,y,z)=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.075,10,10),dotMat);
    m.position.set(x,y,z);meshGroup.add(m);
  };
  if(shapeId==='cube'){
    const s=0.8;
    for(const x of[-s,s])for(const y of[-s,s])for(const z of[-s,s])addDot(x,y,z);
  } else if(shapeId==='rect'){
    const[x,y,z]=[1.1,0.6,0.5];
    for(const xi of[-x,x])for(const yi of[-y,y])for(const zi of[-z,z])addDot(xi,yi,zi);
  } else if(shapeId==='triprism'){
    [[-1.05,-0.75,-0.75],[1.05,-0.75,-0.75],[0,0.9,-0.75],
     [-1.05,-0.75,0.75],[1.05,-0.75,0.75],[0,0.9,0.75]].forEach(v=>addDot(...v));
  } else if(shapeId==='cone'){
    addDot(0,1.05,0);
  }

  /* Smiley face on sphere */
  if(shapeId==='sphere'){
    const fc=new THREE.Color(color);fc.multiplyScalar(0.45);
    const fm=new THREE.MeshBasicMaterial({color:fc});
    const R=1.12;
    for(const ex of[-0.3,0.3]){
      const ey=0.3,ez=Math.sqrt(Math.max(0,R*R-ex*ex-ey*ey));
      const m=new THREE.Mesh(new THREE.SphereGeometry(0.1,12,12),fm);
      m.position.set(ex,ey,ez);meshGroup.add(m);
    }
    const pts=[];
    for(let i=0;i<=16;i++){
      const t=i/16,ang=-0.6+t*1.2;
      const sx=Math.sin(ang)*0.5,sy=-0.15+Math.sin(t*Math.PI)*(-0.28);
      const sz=Math.sqrt(Math.max(0,R*R-sx*sx-sy*sy));
      pts.push(new THREE.Vector3(sx,sy,sz));
    }
    const tube=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),24,0.055,8,false);
    meshGroup.add(new THREE.Mesh(tube,fm));
  }

  scene.add(meshGroup);
  autoRotate=true;animId=null;
  (function loop(){
    animId=requestAnimationFrame(loop);
    if(autoRotate&&meshGroup)meshGroup.rotation.y+=0.0035;
    renderer.render(scene,camera);
  })();
}

/* ── Select shape ── */
function selectShape(shape){
  currentShape=shape;
  document.getElementById('shape-title').textContent=shape.name;
  document.querySelectorAll('.shape-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===shape.id));
  ['corners','edges','faces'].forEach(k=>{
    const i=document.getElementById('inp-'+k);
    i.value='';i.classList.remove('correct','wrong');i.style.cssText='';
  });
  document.getElementById('result-msg').textContent='';
  buildScene(shape.id,shape.color);
}

/* ── Input focus styles ── */
['corners','edges','faces'].forEach(k=>{
  const inp=document.getElementById('inp-'+k);
  inp.addEventListener('focus',()=>{
    if(!inp.classList.contains('correct')&&!inp.classList.contains('wrong'))
      inp.style.borderColor='#378ADD';
  });
  inp.addEventListener('blur',()=>{
    if(!inp.classList.contains('correct')&&!inp.classList.contains('wrong'))
      inp.style.borderColor='';
  });
  inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[^0-9]/g,'').slice(0,2);});
});

/* ── Check answers ── */
document.getElementById('check-btn').addEventListener('click',()=>{
  const ans={corners:currentShape.corners,edges:currentShape.edges,faces:currentShape.faces};
  let correct=0,total=0;
  ['corners','edges','faces'].forEach(k=>{
    const inp=document.getElementById('inp-'+k);
    const val=parseInt(inp.value,10);
    inp.classList.remove('correct','wrong');inp.style.borderColor='';
    if(!inp.value)return;
    total++;
    if(val===ans[k]){inp.classList.add('correct');correct++;}
    else inp.classList.add('wrong');
  });
  const msg=document.getElementById('result-msg');
  if(!total){msg.textContent='Fill in your answers first!';msg.style.color='#aaa';return;}
  msg.textContent=correct===total?'🎉 All correct!':correct+' of '+total+' correct — try again!';
  msg.style.color=correct===total?'#1D9E75':'#E24B4A';
});

/* ── Start ── */
selectShape(currentShape);
</script>
</body>
</html>
